[workspace]
name = "dev-workbench"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
git = "*"
pytest = "*"
mypy = "*"
ruff = "*"
copier = "*"

[pypi-dependencies]
fasthep-dev-workbench = { path = ".", editable = true }

[tasks]
lint = "ruff check ."
typecheck = "mypy src"
test = "python -m pytest -q"
