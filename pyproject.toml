[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasthep-dev-workbench"
version = "2026.11.0"
description = "Set up and inspect multi-repository development workspaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["tomlkit>=0.12", "PyGithub>=2.1", "python-gitlab>=4", "PyYAML>=6"]

[project.scripts]
dev-workbench = "dev_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
check_untyped_defs = true
